server:
  port: 8080

spring:
  application:
    name: frankintest-api
  web:
    cors:
      allowed-origins: "http://localhost:3000"
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/frankintest_dev}
    username: ${POSTGRES_USER:frankintest}
    password: ${POSTGRES_PASSWORD:frankintest_dev}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

app:
  name: FrankInTest API
  version: 0.1.0

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-32-chars!!}
  demo-ttl-seconds: ${JWT_DEMO_TTL:86400}

demo-auth:
  enabled: ${DEMO_AUTH_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

ai:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    version: 2023-06-01
    timeout-seconds: ${AI_PROVIDER_TIMEOUT_SECONDS:30}
  mock-enabled: ${AI_MOCK_ENABLED:false}
